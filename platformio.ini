; Lun-E Glyph rover firmware (Glyph ESP32-S3; 4 MB flash setting works on both
; the 8 MB and the 4 MB + PSRAM versions)
;
; Uses pioarduino (Arduino-ESP32 core 3.x). The stock "espressif32" platform
; in the PlatformIO registry is still on core 2.x and will NOT build this.
;
; Flash: pio run -t upload        Monitor: pio device monitor
; If the upload can't connect: hold BOOT while plugging in USB.

[env:lune-glyph]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0
  olikraus/U8g2@^2.35.30
